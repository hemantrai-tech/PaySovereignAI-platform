function landing(){return `<nav class="nav"><div class="container navin"><a class="brand" href="#top"><span class="shield">◇</span>PaySovereignAI</a><button class="btn mobileToggle" onclick="$('.navlinks').classList.toggle('open')" aria-label="Open navigation">☰</button><div class="navlinks"><a href="#platform">Platform</a><a href="#how">How It Works</a><a href="#security">Security</a><a href="#features">Features</a></div><div class="actions"><a class="loginLink" href="/login" onclick="event.preventDefault();go('login')">Log in</a><button class="btn primary" onclick="go('register')">Get Started</button></div></div></nav><main><section class="hero" id="top"><div class="floatWords"><span>AUTONOMY</span><span>TRUST</span><span>CONTROL</span><span>GOVERNANCE</span><span>SECURITY</span><span>INTELLIGENCE</span></div><div class="container heroGrid"><div class="heroCopy"><div class="eyebrow">AI COMMERCE SECURITY PLATFORM</div><h1>Let AI do more.<br>Keep your money<br><span class="serif">under control.</span></h1><p class="lead">PaySovereignAI gives AI purchasing agents the freedom to act within the financial boundaries you define. Set spending limits, control merchants, and approve sensitive transactions before payments execute.</p><div class="heroBtns"><button class="btn primary" onclick="document.querySelector('#platform').scrollIntoView({behavior:'smooth'})">Explore the Platform&nbsp; ↗</button><a class="btn" href="#how">View How It Works</a></div><div class="checks"><span>Policy-driven purchasing</span><span>User-defined limits</span><span>Transparent decisions</span></div></div><div class="flow" aria-label="Conceptual policy flow: AI agent to policy engine to PayPal payment"><div class="orbit"></div><div class="pill">A SAFER PURCHASE FLOW</div><div class="core"><div><b>POLICY<br>ENGINE</b><small>Server-enforced</small></div></div><div class="node n1"><i>↗</i>Spending Limits</div><div class="node n2"><i>⌖</i>Merchant Permissions</div><div class="node n3"><i>◇</i>Approval Rules</div><div class="node n4"><i>≡</i>Transaction Audit</div><div class="miniFlow"><b>AI AGENT</b><em>⟶</em><b>POLICY ENGINE</b><em>⟶</em><b>PAYPAL PAYMENT</b></div></div></div></section><section class="section" id="platform"><div class="container"><div class="intro"><div class="eyebrow">THE PLATFORM</div><h2>Autonomous purchasing.<br><span class="serif">Enforced boundaries.</span></h2><p>AI agents can propose the next action. PaySovereignAI determines whether the request complies with the user's configured financial policies.</p></div><div class="cards" id="features"><article class="card"><div class="icon">⌁</div><h3>Spending Controls</h3><p>Set per-transaction limits and daily or monthly budgets before your AI agent starts purchasing.</p></article><article class="card"><div class="icon">⌖</div><h3>Merchant Governance</h3><p>Restrict purchasing to approved merchants and reject requests that violate your merchant policy.</p></article><article class="card"><div class="icon">◇</div><h3>Approval Workflows</h3><p>Require explicit user approval when a transaction crosses your threshold or needs additional review.</p></article></div></div></section><section class="section alt" id="how"><div class="container"><div class="intro"><div class="eyebrow">HOW IT WORKS</div><h2>Rules first.<br><span class="serif">Then action.</span></h2><p>The policy engine stands independently between the AI proposal and any payment step.</p></div><div class="steps"><div class="step"><div class="num">STEP 01</div><h3>Define Your Rules</h3><p>Configure budgets, approved merchants, and approval requirements.</p></div><div class="step"><div class="num">STEP 02</div><h3>AI Proposes</h3><p>The agent submits a structured purchase proposal for review.</p></div><div class="step"><div class="num">STEP 03</div><h3>Policy Evaluates</h3><p>The backend checks current limits and merchant permissions.</p></div><div class="step"><div class="num">STEP 04</div><h3>Execute or Reject</h3><p>Compliant requests move forward; rejected requests stop before payment.</p></div></div></div></section><section class="section" id="security"><div class="container security"><div><div class="eyebrow">SECURITY BY DESIGN</div><h2>Autonomy should never mean <span class="serif">unlimited authority.</span></h2><p class="muted">The agent proposes. Your server-side policy decides. This demo records policy decisions separately from verified payment outcomes.</p></div><div class="securityList"><div class="secItem">Server-side policy enforcement</div><div class="secItem">Protected account access</div><div class="secItem">Merchant restrictions</div><div class="secItem">Explicit approval workflows</div><div class="secItem">Transaction audit history</div><div class="secItem">Secure credential handling</div></div></div></section><section class="closing"><div class="container"><div class="eyebrow">AI FREEDOM. YOUR CONTROL.</div><h2>Give your AI the freedom to act.<br><span class="serif">Keep the final say.</span></h2><p>Build a smarter purchasing workflow with financial policies designed around your rules.</p><button class="btn primary" onclick="go('register')">Get Started&nbsp; ↗</button>&nbsp; <a class="textlink" href="#platform">Explore the Platform</a></div></section></main><footer><div class="container foot"><div><a class="brand" href="#top"><span class="shield">◇</span>PaySovereignAI</a><p>AI Freedom. Your Control.<br>Policy controls for AI-powered commerce.</p></div><div class="footLinks"><a href="#platform">Platform</a><a href="#security">Security</a><a href="#">Privacy</a><a href="#">Terms</a><a href="mailto:">Contact</a></div><small>© 2026 PaySovereignAI · Demonstration platform</small></div></footer>`}
function auth(reg){return `<div class="authPage"><div class="authAside"><a class="brand" href="/" onclick="event.preventDefault();go('home')"><span class="shield">◇</span>PaySovereignAI</a><div style="margin-top:80px"><div class="eyebrow">AI FREEDOM. YOUR CONTROL.</div><h2 style="margin-top:20px">Let intelligence<br>move at <span class="serif">your pace.</span></h2><p>Define the boundaries. Your policy engine enforces them before a purchase can move forward.</p><div class="callout" style="margin-top:30px">New accounts start with safe defaults. Payment execution is never enabled automatically.</div></div></div><div class="authFormWrap"><div class="authBox"><a class="textlink" href="/" onclick="event.preventDefault();go('home')">← Back to PaySovereignAI</a><h2>${reg?'Create your account':'Welcome back'}</h2><div class="muted">${reg?'Set up your policy-controlled workspace.':'Sign in to your secure workspace.'}</div>${location.protocol==='file:'?'<div class="callout" style="margin-top:16px">Login screen preview. Start the backend with <code>python main.py</code> from the app folder, then open <code>http://127.0.0.1:8000</code> to sign in and reach your dashboard.</div>':''}<div class="authError" id="authError"></div><form onsubmit="submitAuth(event,${reg})">${reg?'<label for="name">Full name</label><input id="name" autocomplete="name" required minlength="2" placeholder="Your name">':''}<label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><div style="position:relative"><input id="password" type="password" autocomplete="${reg?'new-password':'current-password'}" required minlength="${reg?10:1}" placeholder="${reg?'At least 10 characters':'Your password'}"><button class="textlink" type="button" onclick="let i=$('#password');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:10px;top:11px;background:none;border:0">Show</button></div>${reg?'<label for="confirm">Confirm password</label><input id="confirm" type="password" required minlength="10" placeholder="Repeat your password"><label style="display:flex;align-items:center;gap:9px"><input id="terms" type="checkbox" required style="width:auto">I accept the terms and privacy policy</label>':'<label style="display:flex;align-items:center;gap:9px"><input type="checkbox" style="width:auto">Remember this device</label><div style="text-align:right"><a class="textlink" href="#" onclick="event.preventDefault();toast(\'Password reset requires a configured email service.\')">Forgot password?</a></div>'}<button class="btn primary" type="submit" ${location.protocol==='file:'?'disabled title="Start the server to continue"':''}>${location.protocol==='file:'?'Open the app server to continue':reg?'Create account':'Sign in'} →</button></form><p class="muted" style="font-size:13px;margin-top:24px">${reg?'Already have an account?':'New to PaySovereignAI?'} <a class="textlink" href="${reg?'/login':'/register'}" onclick="event.preventDefault();go('${reg?'login':'register'}')">${reg?'Sign in':'Create an account'}</a></p><p class="help">Passwords are protected with PBKDF2 and never stored in plain text.</p></div></div></div>`}
const navs=[['overview','◫','Overview'],['agent','✳','AI Agent'],['policies','⌁','Policies'],['transactions','≡','Transactions'],['approvals','◇','Approvals'],['accounts','↗','Connected Accounts'],['settings','⚙','Settings']];
function shell(content,title){return `<div class="appShell"><aside class="sidebar"><a class="brand" href="/dashboard" onclick="event.preventDefault();go('overview')"><span class="shield">◇</span>PaySovereignAI</a><div class="sideNav">${navs.map(n=>`<a class="${view===n[0]?'active':''}" href="/dashboard/${n[0]}" onclick="event.preventDefault();go('${n[0]}')"><span>${n[1]}</span>${n[2]}</a>`).join('')}</div><div class="sideBottom"><div class="help">AI Freedom. Your Control.</div><button class="btn" style="width:100%;margin-top:12px" onclick="logout()">Sign out</button></div></aside><main class="main"><div class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobileSide" onclick="$('.sideNav').classList.toggle('open')" aria-label="Open dashboard navigation">☰</button><h2>${title}</h2></div><div class="muted" style="font-size:12px">${esc(me?.name||'Account')} &nbsp;·&nbsp; <span style="color:var(--green)">●</span> Protected session</div></div><div class="content">${content}</div></main></div>`}
function fmt(n,c='USD'){return new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(Number(n||0))}
function overview(){let tx=db?.transactions||[],props=db?.proposals||[],p=db?.policy||{};let total=tx.filter(x=>['COMPLETED','DEMO_RECORDED','PAYMENT_PENDING'].includes(x.payment_status)).reduce((a,x)=>a+Number(x.amount),0);let blocked=props.filter(x=>x.status==='BLOCKED').length;let rem=Math.max(0,Number(p.daily||0)-total);return `<div class="pagehead"><div><h2>Account overview</h2><div class="muted">Your policy activity at a glance.</div></div><span class="badge">${db?.paypal_configured?'PAYPAL CONFIGURED':'PAYPAL SANDBOX · NOT CONFIGURED'}</span></div><div class="stats"><div class="stat"><small>Recorded activity · rolling 30 days</small><strong>${fmt(total,p.currency)}</strong><em>Demo records are not payments</em></div><div class="stat"><small>Approved requests</small><strong>${props.filter(x=>['READY_FOR_PAYMENT','COMPLETED'].includes(x.status)).length}</strong><em>Policy decision</em></div><div class="stat"><small>Blocked requests</small><strong>${blocked}</strong><em>Stopped before payment</em></div><div class="stat"><small>Pending approvals</small><strong>${(db?.approvals||[]).length}</strong><em>Awaiting your decision</em></div><div class="stat"><small>Daily budget remaining</small><strong>${fmt(rem,p.currency)}</strong><em>Based on recorded activity</em></div></div><div class="layout2"><section class="panel"><div class="panelHead"><h3>Recent transaction attempts</h3><a class="textlink" href="/dashboard/transactions" onclick="event.preventDefault();go('transactions')">View all →</a></div>${tx.length?tableTx(tx.slice(0,7)):'<div class="empty">No transaction activity yet. Propose a sample purchase in the AI Agent workspace.</div>'}</section><section class="panel"><div class="panelHead"><h3>Policy status</h3><a class="textlink" href="/dashboard/policies" onclick="event.preventDefault();go('policies')">Edit →</a></div><div class="callout">Server evaluation is active. Proposals are checked against transaction, rolling daily and rolling 30-day limits, merchant rules, and approval thresholds.</div><p class="help">Per transaction: <b>${fmt(p.per_tx,p.currency)}</b></p><p class="help">Daily / 30-day: <b>${fmt(p.daily,p.currency)}</b> / <b>${fmt(p.monthly,p.currency)}</b></p><p class="help">Merchant mode: <b>${p.mode==='allowlist'?'Approved list':'Restricted list'}</b></p></section></div><section class="panel"><div class="panelHead"><h3>Activity snapshot</h3><span class="badge">REAL RECORDS · NO SEEDED ACTIVITY</span></div><div style="height:90px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line)">${[0,0,0,0,0,0,0].map((v,i)=>`<div title="No recorded spend" style="flex:1;height:${4+i%2*3}px;background:rgba(23,105,255,.4)"></div>`).join('')}</div><div class="help" style="margin-top:9px">No spend trend until activity is recorded. Samples remain clearly marked as demo only.</div></section>`}
function tableTx(tx){return `<div class="tableWrap"><table><thead><tr><th>Date</th><th>Agent</th><th>Merchant / item</th><th>Amount</th><th>Policy</th><th>Payment</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${new Date(Number(x.created)*1000).toLocaleString()}</td><td>${esc(x.agent||'Demo agent')}</td><td>${esc(x.merchant||'—')}<br><span class="help">${esc(x.product||'')}</span></td><td>${fmt(x.amount,x.currency)}</td><td><span class="badge ${esc(x.policy_status||x.decision)}">${esc(x.policy_status||x.decision)}</span></td><td><span class="badge">${esc(x.payment_status||x.status)}</span></td></tr>`).join('')}</tbody></table></div>`}
function policyPage(){let p=db.policy||{};let merchants=JSON.parse(p.merchants||'[]');return `<div class="pagehead"><div><h2>Spending policies</h2><div class="muted">Limits and merchant checks are evaluated on the server for every proposal.</div></div><span class="badge">VERSION ${p.version||1}</span></div><div class="callout">Budgets use a rolling 24-hour and 30-day window. Pending approvals reserve their amount. The demo payment path never charges money.</div><form class="panel" onsubmit="savePolicy(event)"><div class="panelHead"><h3>Active policy</h3><span class="badge">${p.active?'ACTIVE':'INACTIVE'}</span></div><div class="fieldGrid"><div class="field"><label>Per-transaction maximum</label><input name="per_tx" type="number" min="0.01" step="0.01" value="${p.per_tx||50}" required></div><div class="field"><label>Rolling 24-hour budget</label><input name="daily" type="number" min="0.01" step="0.01" value="${p.daily||100}" required></div><div class="field"><label>Rolling 30-day budget</label><input name="monthly" type="number" min="0.01" step="0.01" value="${p.monthly||1000}" required></div><div class="field"><label>Currency</label><select name="currency">${['USD','CAD','EUR','GBP','INR'].map(c=>`<option ${p.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Merchant permission mode</label><select name="mode"><option value="allowlist" ${p.mode==='allowlist'?'selected':''}>Allowlist · only these merchants</option><option value="restriction" ${p.mode==='restriction'?'selected':''}>Restriction list · block these merchants</option></select></div><div class="field"><label>Approval required at or above</label><input name="approval_threshold" type="number" min="0" step="0.01" value="${p.approval_threshold||35}" required></div><div class="field"><label>Merchant identifiers (comma separated)</label><input name="merchants" value="${esc(merchants.join(', '))}" placeholder="office-grove, northstar-goods"><div class="help">Identifiers come from the verified demo catalog.</div></div><div class="field"><label style="display:flex;gap:9px;align-items:center"><input name="approval_new" type="checkbox" style="width:auto" ${p.approval_new?'checked':''}>Require approval for a new merchant</label></div></div><button class="btn primary" type="submit" style="margin-top:22px">Save policy</button></form>`}
function agentPage(){return `<div class="pagehead"><div><h2>AI purchasing agent</h2><div class="muted">Deterministic sample catalog · proposals are independently evaluated by the policy service.</div></div><span class="badge">DEMO CATALOG</span></div><div class="callout">This workspace uses a local product catalog because no AI or product-search credentials are configured. Product details are sample fixtures; they do not come from a live AI service.</div><div class="panel" style="margin-top:15px"><div class="panelHead"><h3>Catalog options</h3><span class="help">Choose a proposal to evaluate current policy.</span></div><div class="catalog">${db.catalog.map(x=>`<div class="product"><h4>${esc(x.name)}</h4><p>${esc(x.merchant)} · ${esc(x.category)}</p><p style="color:#d7e6fa;margin-top:5px">${fmt(x.price,x.currency)}</p><button class="btn" onclick="propose('${x.id}')">Submit proposal</button></div>`).join('')}</div></div><div class="panel"><div class="panelHead"><h3>Decision history</h3></div>${db.proposals.length?`<div class="tableWrap"><table><thead><tr><th>Product</th><th>Merchant</th><th>Amount</th><th>Decision</th><th>Explanation</th></tr></thead><tbody>${db.proposals.map(x=>`<tr><td>${esc(x.product)}</td><td>${esc(x.merchant)}</td><td>${fmt(x.amount,x.currency)}</td><td><span class="badge ${esc(x.decision)}">${esc(x.decision)}</span></td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No proposals yet.</div>'}</div>`}
function approvalsPage(){let a=db.approvals||[];return `<div class="pagehead"><div><h2>Pending approvals</h2><div class="muted">Review exact transaction details before approving. Approval does not mean payment success.</div></div></div>${a.length?a.map(x=>`<div class="panel"><div class="panelHead"><h3>${esc(x.product)}</h3><span class="badge PENDING_APPROVAL">PENDING YOUR REVIEW</span></div><p class="muted">${esc(x.merchant)} · ${fmt(x.amount,x.currency)} · ${esc(x.agent)}</p><div class="callout">${esc(x.reason)}</div><div style="display:flex;gap:10px;margin-top:17px"><button class="btn primary" onclick="decide('${x.proposal_id}','approve')">Approve request</button><button class="btn" onclick="decide('${x.proposal_id}','reject')">Reject</button></div></div>`).join(''):'<div class="panel empty">No requests are waiting for approval.</div>'}`}
function txPage(){let rows=db.proposals||[];return `<div class="pagehead"><div><h2>Transaction monitoring</h2><div class="muted">Policy permission and payment outcome are separate states.</div></div><select onchange="filter=this.value;render()" style="background:#06142c;color:white;border:1px solid var(--line);padding:10px"><option value="ALL">All requests</option><option value="ALLOWED">Allowed</option><option value="BLOCKED">Blocked</option><option value="PENDING_APPROVAL">Pending approval</option><option value="COMPLETED">Completed</option></select></div><div class="callout" style="margin-bottom:14px">Sample recording is a local demonstration only. It never calls PayPal and is never a payment.</div><div class="panel">${rows.length?`<div class="tableWrap"><table><thead><tr><th>Date</th><th>Agent</th><th>Merchant</th><th>Item</th><th>Amount</th><th>Decision</th><th>Payment status</th><th>Explanation / action</th></tr></thead><tbody>${rows.filter(x=>filter==='ALL'||x.decision===filter||x.status===filter).map(x=>{let tx=(db.transactions||[]).find(t=>t.proposal_id===x.id);return `<tr><td>${new Date(Number(x.created)*1000).toLocaleString()}</td><td>${esc(x.agent)}</td><td>${esc(x.merchant)}</td><td>${esc(x.product)}</td><td>${fmt(x.amount,x.currency)}</td><td><span class="badge ${esc(x.decision)}">${esc(x.decision)}</span></td><td>${esc(tx?.payment_status||'NOT EXECUTED')}</td><td>${esc(x.reason)}${tx?.payment_status==='NOT_STARTED'&&x.status==='READY_FOR_PAYMENT'?`<br><button class="btn" style="margin-top:8px;padding:7px" onclick="recordDemo('${tx.id}')">Record sample outcome</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No transaction attempts recorded.</div>'}</div>`}
function settingsPage(){return `<div class="pagehead"><div><h2>Account & security settings</h2><div class="muted">Profile, session, and provider configuration.</div></div></div><div class="panel"><h3>Profile</h3><p>${esc(me.name)} · ${esc(me.email)}</p><div class="help">Account created with secure server-side password hashing.</div></div><div class="panel"><h3>Connected payment provider</h3><p><span class="badge">${db.paypal_configured?'PAYPAL SANDBOX · CONFIGURED':'PAYPAL SANDBOX · NOT CONFIGURED'}</span></p>${db.paypal_configured?'<div class="help">Server credentials are present. Complete an official buyer approval flow before treating any payment as real.</div>':'<div class="callout">Set PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, and PAYPAL_ENVIRONMENT=sandbox in the server environment, then restart. Credentials are read only by the backend. This build does not create or capture PayPal orders yet.</div>'}</div><div class="panel"><h3>Session</h3><p class="help">Session cookie is HttpOnly and SameSite=Lax. In production, serve over HTTPS and set HTTPS=1.</p><button class="btn" onclick="logout()">Sign out this session</button></div>`}
function accountsPage(){return settingsPage()}
function render(){let root=$('#app');if(view==='home'){document.title='PaySovereignAI — AI Freedom. Your Control.';root.innerHTML=landing();window.onscroll=()=>$('.nav')?.classList.toggle('scrolled',scrollY>12);return}if(view==='login'||view==='register'){root.innerHTML=auth(view==='register');return}if(!me){go('login');return}let titles={overview:'Overview',agent:'AI Agent',policies:'Policies',transactions:'Transactions',approvals:'Approvals',settings:'Settings',accounts:'Connected Accounts'};let body={overview,agent:agentPage,policies:policyPage,transactions:txPage,approvals:approvalsPage,settings:settingsPage,accounts:accountsPage}[view]||overview;root.innerHTML=shell(body(),titles[view]||'Overview')}
async function load(){view=currentView();try{let s=await api('/api/me');me=s.user;if(me){db=await api('/api/dashboard');view=currentView()==='home'?'overview':currentView()}}catch{if(location.protocol!=='file:')view=currentView()}render()}
async function submitAuth(e,reg){e.preventDefault();let data={email:$('#email').value,password:$('#password').value};if(reg){data.name=$('#name').value;data.confirm=$('#confirm').value;data.terms=$('#terms').checked;if(data.password!==data.confirm){$('#authError').textContent='Passwords do not match.';return}}try{let j=await api(reg?'/api/register':'/api/login',data);me=j.user;db=await api('/api/dashboard');toast(reg?'Account created. Review your safe default policy.':'Signed in securely.');go('overview')}catch(err){if(location.protocol!=='file:')$('#authError').textContent=err.message}}
async function logout(){await api('/api/logout',{});me=null;db=null;go('home')}
async function savePolicy(e){e.preventDefault();let f=new FormData(e.target);let data={per_tx:f.get('per_tx'),daily:f.get('daily'),monthly:f.get('monthly'),currency:f.get('currency'),mode:f.get('mode'),merchants:String(f.get('merchants')||'').split(',').map(x=>x.trim()).filter(Boolean),approval_threshold:f.get('approval_threshold'),approval_new:f.has('approval_new')};try{await api('/api/policy',data);db=await api('/api/dashboard');toast('Policy saved. New proposals will use the updated rules.');render()}catch(x){toast(x.message)}}
async function propose(id){try{let j=await api('/api/propose',{product_id:id,request_key:crypto.randomUUID()});toast(`${j.decision}: ${j.reason}`);db=await api('/api/dashboard');render()}catch(e){toast(e.message)}}
async function decide(id,action){try{let j=await api('/api/approval/'+encodeURIComponent(id),{action});toast(j.message||`Request ${action}d. Payment was not executed.`);db=await api('/api/dashboard');render()}catch(e){toast(e.message)}}
async function recordDemo(id){if(!confirm('Record sample activity only? No payment will be made.'))return;try{let j=await api('/api/demo-pay/'+encodeURIComponent(id),{});toast(j.message);db=await api('/api/dashboard');render()}catch(e){toast(e.message)}}
document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))setTimeout(()=>$('.navlinks')?.classList.remove('open'),100)});
load();
</script></body></html>
